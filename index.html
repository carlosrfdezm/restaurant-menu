<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carta Digital - Restaurante</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- ===== HEADER - SOLO UNO ===== -->
        <header class="header">
            <div class="header-content">
                <h1>🍽️ Carta Digital</h1>
                <div class="header-actions">
                    <!-- Botón de seguimiento -->
                    <button id="trackingBtn" style="display: none; background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--secondary); padding: 0.3rem 0.6rem; border-radius: 8px; background: #f0f0f0;" title="Ver seguimiento del pedido">
                        <i class="fas fa-truck"></i>
                    </button>
                    <!-- Acceso admin -->
                    <a href="admin.html" class="btn-admin-link" title="Panel de Administración">
                        <i class="fas fa-user-cog"></i>
                    </a>
                    <!-- Carrito -->
                    <div class="cart-icon" id="cartIcon">
                        <i class="fas fa-shopping-cart"></i>
                        <span class="cart-badge" id="cartBadge">0</span>
                    </div>
                </div>
            </div>
            <div class="table-selector">
                <label>Mesa:</label>
                <input type="number" id="tableNumber" placeholder="N°" min="1" max="99" required>
            </div>
        </header>

        <!-- ===== BANNER DE BIENVENIDA ===== -->
        <div id="welcomeBanner" style="display: none;">
            <i class="fas fa-utensils"></i> 
            ¡Bienvenido a la Mesa <span id="welcomeTable">-</span>!
            <span style="opacity: 0.8; font-size: 0.8rem; margin-left: 0.5rem;">
                <i class="fas fa-qrcode"></i> Escanea el QR para ver la carta
            </span>
        </div>

        <!-- ===== NAVEGACIÓN DE CATEGORÍAS ===== -->
        <nav class="categories-nav" id="categoriesNav">
            <!-- Generado dinámicamente -->
        </nav>

        <!-- ===== MENÚ ===== -->
        <main class="menu-container" id="menuContainer">
            <!-- Generado dinámicamente -->
        </main>

        <!-- ===== CARRITO ===== -->
        <div class="cart-panel" id="cartPanel">
            <div class="cart-header">
                <h2><i class="fas fa-shopping-cart"></i> Tu Pedido</h2>
                <button class="close-cart" id="closeCart">&times;</button>
            </div>
            <div class="cart-items" id="cartItems">
                <!-- Items del carrito -->
            </div>
            <div class="cart-summary">
                <div class="cart-total">
                    <span>Total:</span>
                    <span id="cartTotal">$0.00</span>
                </div>
                <button class="btn-primary btn-place-order" id="placeOrder">
                    <i class="fas fa-check"></i> Realizar Pedido
                </button>
            </div>
        </div>

        <!-- ===== OVERLAY ===== -->
        <div class="overlay" id="overlay"></div>

        <!-- ===== PANEL DE SEGUIMIENTO ===== -->
        <div class="order-tracking-panel" id="orderTrackingPanel" style="display: none;">
            <div class="tracking-header">
                <h3><i class="fas fa-truck"></i> Seguimiento del Pedido</h3>
                <button class="close-tracking" id="closeTracking">&times;</button>
            </div>
            <div id="trackingContent">
                <div class="tracking-status">
                    <div class="status-step" id="stepPending">
                        <i class="fas fa-clock"></i>
                        <span>Pendiente</span>
                    </div>
                    <div class="status-line"></div>
                    <div class="status-step" id="stepPreparing">
                        <i class="fas fa-kitchen-set"></i>
                        <span>Preparando</span>
                    </div>
                    <div class="status-line"></div>
                    <div class="status-step" id="stepReady">
                        <i class="fas fa-check-circle"></i>
                        <span>Listo</span>
                    </div>
                    <div class="status-line"></div>
                    <div class="status-step" id="stepDelivered">
                        <i class="fas fa-flag-checkered"></i>
                        <span>Entregado</span>
                    </div>
                </div>
                <div class="tracking-info">
                    <p><strong>Pedido #<span id="trackingOrderId">-</span></strong></p>
                    <p><strong>Mesa:</strong> <span id="trackingTable">-</span></p>
                    <p><strong>Total:</strong> <span id="trackingTotal">-</span></p>
                    <p><strong>Estado:</strong> <span id="trackingStatus" class="status-pending">Pendiente</span></p>
                </div>
            </div>
        </div>

        <!-- ===== ACCESO ADMIN (SOLO UNO) ===== -->
        <div class="admin-access-hint">
            <a href="admin.html" title="Panel de Administración">
                <i class="fas fa-user-cog"></i> Admin
            </a>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "https://esm.sh/@supabase/supabase-js@2.39.0": "https://esm.sh/@supabase/supabase-js@2.39.0"
            }
        }
    </script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
