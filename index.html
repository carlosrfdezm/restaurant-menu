<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Carta Digital - Restaurante</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>🍽️ Carta Digital</h1>
                <div class="cart-icon" id="cartIcon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-badge" id="cartBadge">0</span>
                </div>
            </div>
            <div class="table-selector">
                <label>Mesa:</label>
                <input type="number" id="tableNumber" placeholder="N°" min="1" max="99" required>
            </div>
        </header>

        <!-- Categorías -->
        <nav class="categories-nav" id="categoriesNav">
            <!-- Generado dinámicamente -->
        </nav>

        <!-- Menú -->
        <main class="menu-container" id="menuContainer">
            <!-- Generado dinámicamente -->
        </main>

        <!-- Carrito -->
        <div class="cart-panel" id="cartPanel">
            <div class="cart-header">
                <h2><i class="fas fa-shopping-cart"></i> Tu Pedido</h2>
                <button class="close-cart" id="closeCart">&times;</button>
            </div>
            <div class="cart-items" id="cartItems">
                <!-- Items del carrito -->
            </div>
            <div class="cart-summary">
                <div class="cart-total">
                    <span>Total:</span>
                    <span id="cartTotal">$0.00</span>
                </div>
                <button class="btn-primary btn-place-order" id="placeOrder">
                    <i class="fas fa-check"></i> Realizar Pedido
                </button>
            </div>
        </div>

        <!-- Overlay -->
        <div class="overlay" id="overlay"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "https://esm.sh/@supabase/supabase-js@2.39.0": "https://esm.sh/@supabase/supabase-js@2.39.0"
            }
        }
    </script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
