<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div id="adminApp">
        <!-- Login -->
        <div id="loginSection" class="login-container">
            <div class="login-box">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <i class="fas fa-utensils" style="font-size: 3rem; color: #e74c3c;"></i>
                    <h1 style="margin-top: 0.5rem;">Panel Admin</h1>
                    <p style="color: #666;">Gestión de pedidos y menú</p>
                </div>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="adminEmail" placeholder="admin@restaurant.com" required>
                    </div>
                    <div class="form-group">
                        <label>Contraseña</label>
                        <input type="password" id="adminPassword" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%;">
                        <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                    </button>
                </form>
            </div>
        </div>

        <!-- Dashboard -->
        <div id="dashboardSection" style="display:none;">
            <!-- Navbar -->
            <nav class="admin-nav">
                <div class="nav-content">
                    <div class="nav-left">
                        <h2><i class="fas fa-utensils"></i> Admin Panel</h2>
                        <span class="nav-badge" id="pendingBadge">0</span>
                    </div>
                    <div class="nav-actions">
                        <button class="btn-nav" id="refreshBtn" title="Actualizar">
                            <i class="fas fa-sync"></i>
                        </button>
                        <button class="btn-nav" id="generateQRBtn" title="Generar QR">
                            <i class="fas fa-qrcode"></i>
                        </button>
                        <button class="btn-nav btn-logout" id="logoutBtn">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>
                    </div>
                </div>
            </nav>

            <!-- Tabs -->
            <div class="admin-tabs">
                <button class="tab-btn active" data-tab="orders">
                    <i class="fas fa-clipboard-list"></i> Pedidos
                </button>
                <button class="tab-btn" data-tab="menu">
                    <i class="fas fa-utensils"></i> Menú
                </button>
                <button class="tab-btn" data-tab="sections">
                    <i class="fas fa-tags"></i> Secciones
                </button>
                <button class="tab-btn" data-tab="qr">
                    <i class="fas fa-qrcode"></i> QR
                </button>
            </div>

            <div class="admin-content">
                <!-- Tab: Pedidos -->
                <div id="tabOrders" class="tab-content active">
                    <div class="section-header">
                        <h3><i class="fas fa-clipboard-list"></i> Todos los Pedidos</h3>
                        <div class="filter-orders">
                            <select id="filterStatus" class="filter-select">
                                <option value="all">Todos</option>
                                <option value="pending">Pendientes</option>
                                <option value="preparing">Preparando</option>
                                <option value="ready">Listos</option>
                                <option value="delivered">Entregados</option>
                            </select>
                        </div>
                    </div>
                    <div id="ordersList" class="orders-list"></div>
                </div>

                <!-- Tab: Menú -->
                <div id="tabMenu" class="tab-content">
                    <div class="section-header">
                        <h3><i class="fas fa-utensils"></i> Platos del Menú</h3>
                        <button class="btn-primary" id="addItemBtn">
                            <i class="fas fa-plus"></i> Nuevo Plato
                        </button>
                    </div>
                    <div id="itemsList" class="admin-grid"></div>
                </div>

                <!-- Tab: Secciones -->
                <div id="tabSections" class="tab-content">
                    <div class="section-header">
                        <h3><i class="fas fa-tags"></i> Secciones</h3>
                        <button class="btn-primary" id="addSectionBtn">
                            <i class="fas fa-plus"></i> Nueva Sección
                        </button>
                    </div>
                    <div id="sectionsList" class="admin-grid"></div>
                </div>

                <!-- Tab: QR -->
                <div id="tabQR" class="tab-content">
                    <div class="qr-generator-section">
                        <div class="section-header">
                            <h3><i class="fas fa-qrcode"></i> Generador de Códigos QR</h3>
                        </div>
                        
                        <div class="qr-generator-container">
                            <div class="qr-controls">
                                <div class="form-group">
                                    <label>Número de Mesa</label>
                                    <input type="number" id="qrTableNumber" min="1" max="99" value="1">
                                </div>
                                <div class="form-group">
                                    <label>Color del QR</label>
                                    <input type="color" id="qrColor" value="#2c3e50">
                                </div>
                                <div class="form-group">
                                    <label>Color de fondo</label>
                                    <input type="color" id="qrBgColor" value="#ffffff">
                                </div>
                                <div class="form-group">
                                    <label>Tamaño (px)</label>
                                    <select id="qrSize">
                                        <option value="200">200px</option>
                                        <option value="300" selected>300px</option>
                                        <option value="400">400px</option>
                                        <option value="500">500px</option>
                                    </select>
                                </div>
                                <button class="btn-primary" id="generateSingleQRBtn" style="width: 100%;">
                                    <i class="fas fa-qrcode"></i> Generar QR
                                </button>
                                <button class="btn-primary" id="downloadQRBtn" style="width: 100%; margin-top: 0.5rem; background: #27ae60;">
                                    <i class="fas fa-download"></i> Descargar QR
                                </button>
                                <button class="btn-primary" id="generateAllQRBtn" style="width: 100%; margin-top: 0.5rem; background: #3498db;">
                                    <i class="fas fa-file-pdf"></i> Generar Todos los QR
                                </button>
                            </div>
                            <div class="qr-preview">
                                <div id="qrPreviewContainer">
                                    <img id="qrImage" src="" alt="Código QR" style="display: none;">
                                    <div id="qrPlaceholder" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 300px; background: #f8f9fa; border-radius: 12px; border: 2px dashed #ddd;">
                                        <i class="fas fa-qrcode" style="font-size: 4rem; color: #ccc; margin-bottom: 1rem;"></i>
                                        <p style="color: #999;">Genera un código QR para tu mesa</p>
                                    </div>
                                </div>
                                <div id="qrInfo" style="display: none; margin-top: 1rem; padding: 1rem; background: #f8f9fa; border-radius: 8px;">
                                    <p><strong>Mesa:</strong> <span id="qrInfoTable">-</span></p>
                                    <p><strong>URL:</strong> <span id="qrInfoUrl" style="word-break: break-all;">-</span></p>
                                    <p><strong>Estado:</strong> <span id="qrInfoStatus" style="color: #27ae60;">Listo para usar</span></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Modales (se mantienen igual) -->
        <div class="modal" id="sectionModal">
            <div class="modal-content">
                <span class="modal-close">&times;</span>
                <h2 id="sectionModalTitle">Nueva Sección</h2>
                <form id="sectionForm">
                    <div class="form-group">
                        <label>Nombre *</label>
                        <input type="text" id="sectionName" required>
                    </div>
                    <div class="form-group">
                        <label>Icono</label>
                        <input type="text" id="sectionIcon" placeholder="fa-pizza-slice">
                    </div>
                    <div class="form-group">
                        <label>Posición</label>
                        <input type="number" id="sectionPosition" value="1" min="1">
                    </div>
                    <button type="submit" class="btn-primary">Guardar</button>
                </form>
            </div>
        </div>

        <div class="modal" id="itemModal">
            <div class="modal-content">
                <span class="modal-close">&times;</span>
                <h2 id="itemModalTitle">Nuevo Plato</h2>
                <form id="itemForm">
                    <div class="form-group">
                        <label>Sección *</label>
                        <select id="itemSection" required></select>
                    </div>
                    <div class="form-group">
                        <label>Nombre *</label>
                        <input type="text" id="itemName" required>
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea id="itemDescription" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Precio *</label>
                        <input type="number" id="itemPrice" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label>URL de Imagen</label>
                        <input type="url" id="itemImage" placeholder="https://ejemplo.com/imagen.jpg">
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="itemAvailable" checked>
                            Disponible
                        </label>
                    </div>
                    <div class="form-group">
                        <label>Posición</label>
                        <input type="number" id="itemPosition" value="1" min="1">
                    </div>
                    <button type="submit" class="btn-primary">Guardar</button>
                </form>
            </div>
        </div>

        <div class="modal" id="orderModal">
            <div class="modal-content modal-order">
                <span class="modal-close">&times;</span>
                <h2><i class="fas fa-receipt"></i> Detalle del Pedido</h2>
                <div id="orderDetail"></div>
            </div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "https://esm.sh/@supabase/supabase-js@2.39.0": "https://esm.sh/@supabase/supabase-js@2.39.0"
            }
        }
    </script>
    <script type="module" src="js/admin.js"></script>
</body>
</html>
